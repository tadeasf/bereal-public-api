services:
  bereal-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bereal-api
    ports:
      - "3299:3299"
    environment:
      - NODE_ENV=production
    volumes:
      - ./programData:/app/programData
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3299/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
